<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C0C0C">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230C0C0C'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='bold' fill='%23D6D3CB' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0C0C;
    --card: #1A1A1A;
    --ink: #E8E6E1;
    --ink-soft: #8C8A85;
    --accent: #D6D3CB;
    --accent-done: #6E6C66;
    --line: #333330;
    --danger: #C97B6A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow-x: hidden;
  }
  body {
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%;
    min-height: 100dvh;
    padding: max(64px, calc(env(safe-area-inset-top) + 44px)) 16px calc(100px + env(safe-area-inset-bottom));
  }
  .wrap.chat-pad { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  .wrap.no-fab-pad { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
    gap: 10px;
  }
  .header-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .menu-btn {
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
    padding: 4px 2px;
    cursor: pointer;
    flex-shrink: 0;
    align-self: center;
    margin-bottom: -2px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: -0.02em;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .count { font-size: 12px; color: var(--ink-soft); }
  .header-action {
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    border-radius: 7px;
    padding: 5px 9px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .header-action:active { border-color: var(--ink); color: var(--ink); }

  /* Drawer menu */
  .drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 30;
  }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: min(76vw, 290px);
    background: var(--card);
    border-right: 1px solid var(--line);
    z-index: 31;
    transform: translateX(-100%);
    transition: transform .22s ease;
    padding: max(28px, calc(env(safe-area-inset-top) + 20px)) 0 calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 0 20px 18px;
    color: var(--ink-soft);
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .drawer-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14.5px;
    text-align: left;
    padding: 14px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .drawer-item .glyph { font-family: 'Space Grotesk', sans-serif; font-weight: 700; width: 18px; flex-shrink: 0; }
  .drawer-item.active { color: var(--ink); border-left-color: var(--accent); background: rgba(255,255,255,0.03); }
  .drawer-item:active { background: rgba(255,255,255,0.05); }

  /* Chat */
  .msg { margin-bottom: 12px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .msg-bubble {
    max-width: 86%;
    padding: 11px 13px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .msg-bubble { background: var(--accent); color: var(--bg); border-bottom-right-radius: 3px; }
  .msg.assistant .msg-bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
  .msg.error .msg-bubble { background: var(--card); border: 1px solid var(--danger); color: var(--danger); }
  .msg-role {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 2px 4px;
  }
  .thinking { display: flex; align-items: center; gap: 4px; padding: 4px 2px; }
  .thinking span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--ink-soft);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: .15s; }
  .thinking span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .chat-empty { text-align: center; padding: 70px 20px; color: var(--ink-soft); font-size: 13px; }
  .chat-empty strong { display: block; font-family: 'Space Grotesk', sans-serif; color: var(--ink); font-size: 17px; margin-bottom: 6px; }

  .chat-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-top: 1.5px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    gap: 8px;
    z-index: 5;
  }
  .chat-textarea {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    line-height: 1.4;
    padding: 11px 13px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    resize: none;
    max-height: 120px;
    min-height: 44px;
  }
  .chat-textarea:focus { outline: none; border-color: var(--accent); }
  .send-btn {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .send-btn:disabled { opacity: 0.4; }
  .mic-btn {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--card);
    color: var(--ink);
    border: 1.5px solid var(--line);
    font-size: 17px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s, color .15s;
  }
  .mic-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #0C0C0C;
    animation: micPulse 1.1s infinite ease-in-out;
  }
  @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(201,123,106,0.45); } 50% { box-shadow: 0 0 0 8px rgba(201,123,106,0); } }
  .mic-btn:disabled { opacity: 0.35; cursor: default; }
  .reminder-chip {
    display: inline-block;
    margin: 6px 2px 0 0;
    padding: 4px 9px;
    border-radius: 20px;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.02em;
  }

  /* Docket (reused from original) */
  .entry {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .entry.done { opacity: 0.6; }
  .entry-top { display: flex; align-items: flex-start; gap: 10px; }
  .checkbox {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 2px solid var(--ink);
    border-radius: 5px;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .entry.done .checkbox { border-color: var(--accent-done); background: var(--accent-done); }
  .checkbox svg { display: none; width: 13px; height: 13px; }
  .entry.done .checkbox svg { display: block; }
  .entry-body { flex: 1; min-width: 0; }
  .entry-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin: 0;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .entry.done .entry-title { text-decoration: line-through; }
  .entry-del {
    background: none; border: none; color: var(--ink-soft);
    font-size: 17px; padding: 2px 4px 2px 8px; cursor: pointer; flex-shrink: 0;
  }
  .stamp {
    position: absolute; top: 6px; right: -8px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.1em;
    color: var(--accent-done); border: 2px solid var(--accent-done); padding: 1px 8px; border-radius: 3px;
    transform: rotate(8deg);
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 13px; }
  .empty strong { display: block; font-family: 'Space Grotesk', sans-serif; color: var(--ink); font-size: 16px; margin-bottom: 6px; }

  .fab {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    right: 20px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 27px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    border: none;
    cursor: pointer;
    z-index: 5;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(22,38,43,0.45);
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .panel {
    background: var(--bg);
    width: 100%;
    border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 24px rgba(0,0,0,0.18);
  }
  .panel h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  textarea.entry-input {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    line-height: 1.4;
    padding: 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    resize: none;
    min-height: 90px;
    margin-bottom: 14px;
  }
  textarea.entry-input:focus { outline: none; border-color: var(--accent); }

  .panel-actions { display: flex; flex-direction: column; gap: 8px; }
  button.pbtn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    padding: 15px 16px;
    cursor: pointer;
    width: 100%;
  }
  .btn-add { background: var(--accent); color: var(--bg); }
  .btn-add:active { background: var(--ink); }
  .btn-add-another { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn-add-another:active { background: var(--line); }
  .btn-cancel { background: transparent; color: var(--ink-soft); font-weight: 600; padding: 10px 16px; }

  .status { text-align: center; font-size: 12px; color: var(--ink-soft); padding: 30px 0; }

  /* Settings */
  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .key-row { display: flex; gap: 8px; }
  .key-row input {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    padding: 12px 13px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    min-width: 0;
  }
  .key-row input:focus { outline: none; border-color: var(--accent); }
  .key-toggle {
    flex-shrink: 0;
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    border-radius: 10px;
    padding: 0 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }
  select.model-select {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    padding: 12px 13px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    appearance: none;
  }
  .field-note { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-top: 8px; }
  .settings-save {
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border-radius: 10px;
    padding: 15px 16px;
    width: 100%;
    cursor: pointer;
    margin-top: 4px;
  }
  .settings-save:active { background: var(--ink); }
  .danger-btn {
    background: transparent;
    border: 1.5px solid var(--danger);
    color: var(--danger);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    border-radius: 10px;
    padding: 12px 14px;
    width: 100%;
    cursor: pointer;
    margin-top: 10px;
  }
  .settings-status { font-size: 12px; color: var(--ink-soft); margin: -8px 0 20px; }

  .debug-fab {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: 14px;
    z-index: 500;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .debug-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--danger);
    color: #0C0C0C;
    font-size: 10px;
    font-weight: 600;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
  }
  .debug-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 600;
    display: none;
    align-items: flex-end;
  }
  .debug-overlay.open { display: flex; }
  .debug-panel {
    background: var(--card);
    width: 100%;
    max-height: 75vh;
    border-radius: 16px 16px 0 0;
    display: flex;
    flex-direction: column;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .debug-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--ink);
  }
  .debug-panel-header h2 { margin: 0; font-size: 15px; }
  .debug-close-btn {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .debug-empty { color: var(--ink-soft); font-size: 13px; padding: 20px 0; text-align: center; }
  .debug-log { overflow-y: auto; flex: 1; }
  .debug-entry { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .debug-entry-meta { color: var(--ink-soft); font-size: 11px; margin-bottom: 4px; }
  .debug-entry-label { color: var(--danger); font-size: 12px; font-weight: 600; }
  .debug-entry pre {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 6px 0 0;
    color: var(--ink);
  }
  .debug-actions { display: flex; gap: 8px; margin-top: 12px; }
  .debug-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .debug-actions .debug-copy-btn { border-color: var(--ink); }
</style>
</head>
<body>
<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-title">Menu</div>
  <button class="drawer-item" data-view="chat"><span class="glyph">?</span>Ask Ledger</button>
  <button class="drawer-item" data-view="docket"><span class="glyph">=</span>Docket</button>
  <button class="drawer-item" data-view="settings"><span class="glyph">*</span>Settings</button>
</nav>
<div class="wrap" id="app"></div>

<button class="debug-fab" id="debugFab" title="Error log">!<span class="debug-badge" id="debugBadge" style="display:none">0</span></button>
<div class="debug-overlay" id="debugOverlay">
  <div class="debug-panel">
    <div class="debug-panel-header">
      <h2>Error log</h2>
      <button class="debug-close-btn" id="debugCloseBtn">close</button>
    </div>
    <div class="debug-log" id="debugLogEl"></div>
    <div class="debug-actions">
      <button class="debug-copy-btn" id="debugCopyBtn">Copy all</button>
      <button id="debugTestBtn">Test connection</button>
      <button id="debugClearBtn">Clear</button>
    </div>
  </div>
</div>

<script>
const app = document.getElementById('app');
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');

const ENTRIES_KEY = 'jarvis_entries';
const CHAT_KEY = 'jarvis_chat';
const SETTINGS_KEY = 'jarvis_settings';

/* ---------- Debug / error log ---------- */
const debugFab = document.getElementById('debugFab');
const debugBadge = document.getElementById('debugBadge');
const debugOverlay = document.getElementById('debugOverlay');
const debugLogEl = document.getElementById('debugLogEl');
let debugEntries = [];
let debugUnread = 0;

function redact(str) {
  if (typeof str !== 'string') { try { str = JSON.stringify(str, null, 2); } catch (e) { str = String(str); } }
  if (settings && settings.apiKey) str = str.split(settings.apiKey).join('[API_KEY_REDACTED]');
  return str;
}

function logDebug(label, details) {
  const entry = {
    time: new Date().toLocaleTimeString(),
    label,
    text: redact(details)
  };
  debugEntries.unshift(entry);
  if (debugEntries.length > 50) debugEntries.length = 50;
  debugUnread++;
  updateDebugBadge();
  if (debugOverlay.classList.contains('open')) renderDebugLog();
}

function updateDebugBadge() {
  if (debugUnread > 0) {
    debugBadge.style.display = 'flex';
    debugBadge.textContent = debugUnread > 99 ? '99+' : String(debugUnread);
  } else {
    debugBadge.style.display = 'none';
  }
}

function renderDebugLog() {
  if (debugEntries.length === 0) {
    debugLogEl.innerHTML = `<div class="debug-empty">No errors logged yet.</div>`;
    return;
  }
  debugLogEl.innerHTML = debugEntries.map(e => `
    <div class="debug-entry">
      <div class="debug-entry-meta">${e.time} — <span class="debug-entry-label">${escapeHtml(e.label)}</span></div>
      <pre>${escapeHtml(e.text)}</pre>
    </div>
  `).join('');
}

function openDebugPanel() {
  debugUnread = 0;
  updateDebugBadge();
  renderDebugLog();
  debugOverlay.classList.add('open');
}
function closeDebugPanel() {
  debugOverlay.classList.remove('open');
}
function copyDebugLog() {
  if (debugEntries.length === 0) { showToast('Nothing to copy yet.'); return; }
  const text = debugEntries.map(e => `[${e.time}] ${e.label}\n${e.text}`).join('\n\n---\n\n');
  const done = () => showToast('Copied to clipboard.');
  const fail = () => showToast("Couldn't copy — select and copy manually.");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) { fail(); }
  }
}
function clearDebugLog() {
  debugEntries = [];
  debugUnread = 0;
  updateDebugBadge();
  renderDebugLog();
}

async function testConnection() {
  openDebugPanel();
  logDebug('diagnostic', 'Running connectivity test…');

  logDebug('diagnostic: environment', `navigator.onLine: ${navigator.onLine}\nstandalone (added to home screen): ${window.navigator.standalone === true}\nuser agent: ${navigator.userAgent}`);

  // Test 1: a neutral external host with no custom headers — checks whether
  // this webview/browser can make ANY cross-origin request at all.
  try {
    const t0 = performance.now();
    const r = await fetch('https://api.github.com/zen', { method: 'GET', cache: 'no-store' });
    const ms = Math.round(performance.now() - t0);
    logDebug('diagnostic: external fetch test', `api.github.com -> HTTP ${r.status} in ${ms}ms (${r.ok ? 'reachable' : 'reached but not ok'})`);
  } catch (e) {
    logDebug('diagnostic: external fetch test', `api.github.com FAILED: ${e.name}: ${e.message}\nThis means outbound requests to other domains are being blocked entirely (not specific to Google) — likely no connection, or the app/browser you're viewing this in is restricting network access.`);
  }

  // Test 2: the actual Gemini API host, with the same auth header the chat uses,
  // but a lightweight GET instead of generateContent.
  if (settings.apiKey) {
    try {
      const t0 = performance.now();
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1', {
        method: 'GET',
        headers: { 'x-goog-api-key': settings.apiKey },
        cache: 'no-store'
      });
      const ms = Math.round(performance.now() - t0);
      let body = '';
      try { body = await r.text(); } catch (e) {}
      logDebug('diagnostic: Gemini API test', `HTTP ${r.status} in ${ms}ms\n${body.slice(0, 400)}`);
    } catch (e) {
      logDebug('diagnostic: Gemini API test', `FAILED: ${e.name}: ${e.message}\nIf the external fetch test above succeeded but this one failed, the block is specific to Google's API domain.`);
    }
  } else {
    logDebug('diagnostic: Gemini API test', 'Skipped — no API key saved yet.');
  }
}

/* ---------- Voice input ---------- */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const speechSupported = !!SpeechRecognitionAPI;
let recognition = null;
let recognizing = false;

function toggleVoiceInput() {
  if (!speechSupported) {
    showToast("Voice input isn't supported in this browser.");
    return;
  }
  if (recognizing) {
    recognition.stop();
    return;
  }
  const input = document.getElementById('chatInput');
  let finalTranscript = '';

  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    recognizing = true;
    finalTranscript = input ? input.value : '';
    render();
  };
  recognition.onresult = (ev) => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const chunk = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalTranscript += (finalTranscript ? ' ' : '') + chunk.trim();
      else interim += chunk;
    }
    const live = document.getElementById('chatInput');
    if (live) {
      live.value = (finalTranscript + ' ' + interim).trim();
      live.style.height = 'auto';
      live.style.height = Math.min(live.scrollHeight, 120) + 'px';
    }
  };
  recognition.onerror = (ev) => {
    logDebug('speech recognition error', `${ev.error || 'unknown error'}`);
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      showToast("Mic access was denied — check this browser's permissions.");
    } else if (ev.error === 'no-speech') {
      showToast("Didn't catch that — try again.");
    }
  };
  recognition.onend = () => {
    recognizing = false;
    const finalEl = document.getElementById('chatInput');
    const text = (finalTranscript || (finalEl ? finalEl.value : '')).trim();
    if (finalEl) { finalEl.value = ''; finalEl.style.height = 'auto'; }
    render();
    if (text) sendChatMessage(text);
  };

  try {
    recognition.start();
  } catch (e) {
    logDebug('speech recognition start failed', e.message || String(e));
    showToast("Couldn't start voice input.");
  }
}

const MODELS = [
  { id: 'gemini-3.6-flash', label: 'Gemini 3.6 Flash — balanced, latest' },
  { id: 'gemini-3.5-flash', label: 'Gemini 3.5 Flash — most intelligent, sustained tasks' },
  { id: 'gemini-3.5-flash-lite', label: 'Gemini 3.5 Flash-Lite — fastest, cheapest' },
  { id: 'gemini-3.1-flash-lite', label: 'Gemini 3.1 Flash-Lite — frontier-class, low cost' }
];

const SYSTEM_PROMPT = "You are Ledger, the user's personal assistant running inside their own app. You're especially good at helping with college coursework — explaining concepts clearly, walking through problem sets step by step, helping outline or revise writing, and checking reasoning. Be direct and concise, but show your work for math, science, or logic problems rather than just giving the final answer. Keep formatting plain (no markdown symbols like ** or #), since this renders as plain text.\n\nThe app also has a Docket, a simple to-do/reminder list. You must watch every message the user sends for anything they want remembered, done later, or reminded about — not just messages that literally say \"remind me.\" This includes explicit asks (\"remind me to call mom at 6\"), implied tasks (\"I need to pick up my prescription tomorrow\", \"don't let me forget the dentist Friday\", \"gotta email professor Lin about the extension\"), and casual mentions of future obligations. For each one you catch, write a short, clear, self-contained task string (e.g. \"Take medication at 5pm\", \"Email professor Lin about the extension\") — including any time/date mentioned — and put it in the reminders array. If a message has no such content, reminders must be an empty array. Never invent reminders that weren't implied by the message. You must always respond with ONLY a JSON object of the exact shape {\"reply\": string, \"reminders\": string[]} and nothing else — no markdown fences, no extra text outside the JSON. The \"reply\" field is your normal conversational answer to the user (plain text, no markdown symbols); if you added reminders, briefly acknowledge that naturally within the reply.";

function loadAll() {
  try { entries = JSON.parse(localStorage.getItem(ENTRIES_KEY) || '[]'); } catch (e) { entries = []; }
  nextId = entries.reduce((m, e) => Math.max(m, e.id), 0) + 1;
  try { messages = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]'); } catch (e) { messages = []; }
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    settings = { apiKey: s.apiKey || '', model: s.model || 'gemini-3.5-flash' };
    // Auto-migrate old/retired model ids saved from before this update
    const retired = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.5-pro', 'gemini-2.0-flash', 'gemini-2.0-flash-lite'];
    if (retired.includes(settings.model)) settings.model = 'gemini-3.5-flash';
  } catch (e) { /* keep defaults */ }
}
function saveEntries() {
  try { localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); }
  catch (e) { showToast("Couldn't save just now."); }
}
function saveMessages() {
  try { localStorage.setItem(CHAT_KEY, JSON.stringify(messages)); } catch (e) {}
}
function saveSettingsToStore() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));background:#2A2A26;color:#E8E6E1;font-family:"IBM Plex Mono",monospace;font-size:12.5px;padding:10px 14px;border-radius:8px;text-align:center;z-index:40;opacity:0;transition:opacity .2s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(() => { t.style.opacity = '0'; }, 2500);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Docket ---------- */
function addEntry(text) {
  entries.unshift({ id: nextId++, text, done: false });
  saveEntries();
}
function toggleDone(id) {
  const e = entries.find(x => x.id === id);
  if (e) e.done = !e.done;
  saveEntries();
  render();
}
function deleteEntry(id) {
  entries = entries.filter(x => x.id !== id);
  saveEntries();
  render();
}
function openPanel() {

/* ---------- Chat ---------- */
function scrollToBottom() {
  requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
}

async function callGemini(history) {
  const recent = history.slice(-16).map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model)}:generateContent`;
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': settings.apiKey
      },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: recent,
        generationConfig: {
          maxOutputTokens: 1500,
          responseMimeType: 'application/json',
          responseSchema: {
            type: 'OBJECT',
            properties: {
              reply: { type: 'STRING' },
              reminders: { type: 'ARRAY', items: { type: 'STRING' } }
            },
            required: ['reply', 'reminders']
          }
        }
      })
    });
  } catch (networkErr) {
    logDebug('network error', `${networkErr.name}: ${networkErr.message}\nmodel: ${settings.model}\nurl: ${url}\n(this usually means no internet connection, or the request was blocked)`);
    throw new Error('Network error — check your connection.');
  }
  if (!res.ok) {
    let bodyText = '';
    try { bodyText = await res.text(); } catch (e) {}
    let detail = '';
    try { detail = JSON.parse(bodyText)?.error?.message || ''; } catch (e) {}
    logDebug(`HTTP ${res.status} ${res.statusText}`, `model: ${settings.model}\nurl: ${url}\n\nresponse body:\n${bodyText || '(empty)'}`);
    throw new Error(detail || `Request failed (${res.status})`);
  }
  let data;
  try {
    data = await res.json();
  } catch (parseErr) {
    logDebug('response parse error', `model: ${settings.model}\n${parseErr.message}`);
    throw new Error('Got a response but could not parse it.');
  }
  const parts = data?.candidates?.[0]?.content?.parts || [];
  const text = parts.map(p => p.text || '').join('\n').trim();
  if (!text) {
    logDebug('empty response', `model: ${settings.model}\nfull response:\n${JSON.stringify(data, null, 2)}`);
  }
  return text || "(no response)";
}

async function sendChatMessage(text) {
  if (!text.trim() || sending) return;
  if (!settings.apiKey) {
    showToast('Add your API key in Settings first.');
    switchView('settings');
    return;
  }
  messages.push({ role: 'user', content: text.trim() });
  saveMessages();
  sending = true;
  render();
  scrollToBottom();

  try {
    const raw = await callGemini(messages);
    let replyText = raw;
    let reminders = [];
    try {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.reply === 'string') {
        replyText = parsed.reply;
        if (Array.isArray(parsed.reminders)) {
          reminders = parsed.reminders.filter(r => typeof r === 'string' && r.trim()).map(r => r.trim());
        }
      }
    } catch (parseErr) {
      logDebug('reminder JSON parse fallback', `Response wasn't valid JSON, showing raw text.\n${raw}`);
    }
    reminders.forEach(r => addEntry(r));
    if (reminders.length === 1) showToast('Added to Docket: ' + reminders[0]);
    else if (reminders.length > 1) showToast(`Added ${reminders.length} items to Docket.`);
    messages.push({ role: 'assistant', content: replyText, reminders });
  } catch (err) {
    messages.push({ role: 'assistant', content: err.message || 'Something went wrong.', error: true });
    logDebug('sendChatMessage caught', err.stack || err.message || String(err));
  }
  sending = false;
  saveMessages();
  render();
  scrollToBottom();
}

function clearChat() {
  if (!confirm('Clear this conversation? This can\'t be undone.')) return;
  messages = [];
  saveMessages();
  render();
}

function clearDocketAll() {
  if (!confirm('Delete all docket entries? This can\'t be undone.')) return;
  entries = [];
  nextId = 1;

/* ---------- Render ---------- */
function render() {
  drawer.querySelectorAll('.drawer-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);
  });

  if (view === 'chat') renderChat();
  else if (view === 'docket') renderDocket();
  else renderSettings();
}

function renderChat() {
  app.className = 'wrap chat-pad';

  let list;
  if (messages.length === 0) {
    list = `<div class="chat-empty">Nothing yet.</div>`;
  } else {
    list = messages.map(m => `
      <div class="msg ${m.role}${m.error ? ' error' : ''}">
        <div>
          <div class="msg-role">${m.role === 'user' ? 'you' : 'ledger'}</div>
          <div class="msg-bubble">${escapeHtml(m.content)}</div>
          ${m.reminders && m.reminders.length ? m.reminders.map(r => `<span class="reminder-chip">+ added to Docket: ${escapeHtml(r)}</span>`).join('') : ''}
        </div>
      </div>
    `).join('');
  }
  if (sending) {
    list += `<div class="msg assistant"><div><div class="msg-role">ledger</div><div class="msg-bubble thinking"><span></span><span></span><span></span></div></div></div>`;
  }

  app.innerHTML = `
    <header>
      <div class="header-left">
        <button class="menu-btn" id="menuBtn">&#9776;</button>
        <h1>Ledger</h1>
      </div>
      ${messages.length ? '<button class="header-action" id="clearChatBtn">clear</button>' : ''}
    </header>
    ${list}
    <div class="chat-bar">
      <textarea class="chat-textarea" id="chatInput" placeholder="…" rows="1"></textarea>
      ${speechSupported ? `<button class="mic-btn${recognizing ? ' listening' : ''}" id="micBtn" ${sending ? 'disabled' : ''}>${recognizing ? '&#9632;' : '&#127908;'}</button>` : ''}
      <button class="send-btn" id="sendBtn" ${sending ? 'disabled' : ''}>&#8593;</button>
    </div>
  `;

  document.getElementById('menuBtn').onclick = openDrawer;
  const clearBtn = document.getElementById('clearChatBtn');
  if (clearBtn) clearBtn.onclick = clearChat;

  const micBtn = document.getElementById('micBtn');
  if (micBtn) micBtn.onclick = toggleVoiceInput;

  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      const text = input.value;
      input.value = '';
      input.style.height = 'auto';
      sendChatMessage(text);
    }
  });
  sendBtn.onclick = () => {
    const text = input.value;
    input.value = '';
    input.style.height = 'auto';
    sendChatMessage(text);
  };

  scrollToBottom();
}

function renderDocket() {
  app.className = 'wrap';
  const doneCount = entries.filter(e => e.done).length;
  let listHtml;

  if (entries.length === 0) {
    listHtml = `<div class="empty">Nothing yet.</div>`;
  } else {
    listHtml = entries.map(e => `
      <div class="entry ${e.done ? 'done' : ''}">
        ${e.done ? '<div class="stamp">done</div>' : ''}
        <div class="entry-top">
          <div class="checkbox" data-id="${e.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>
          </div>
          <div class="entry-body">
            <div class="entry-title">${escapeHtml(e.text)}</div>
          </div>
          <button class="entry-del" data-del="${e.id}">✕</button>
        </div>
      </div>
    `).join('');
  }

  app.innerHTML = `
    <header>
      <div class="header-left">
        <button class="menu-btn" id="menuBtn">&#9776;</button>
        <h1>Docket</h1>
      </div>
      <div class="count">${entries.length} · ${doneCount} done</div>
    </header>
    ${listHtml}
    <button class="fab" id="addBtn">+</button>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2>New entry</h2>
        <textarea class="entry-input" id="fText" placeholder="Type here…" rows="3" autofocus></textarea>
        <div class="panel-actions">
          <button class="pbtn btn-add" id="addOneBtn">Add</button>
          <button class="pbtn btn-add-another" id="addAnotherBtn">Add & add another</button>
          <button class="pbtn btn-cancel" id="cancelBtn">Cancel</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('menuBtn').onclick = openDrawer;
  document.getElementById('addBtn').onclick = openPanel;
  document.getElementById('cancelBtn').onclick = closePanel;
  document.getElementById('overlay').onclick = (ev) => { if (ev.target.id === 'overlay') closePanel(); };

  document.getElementById('addOneBtn').onclick = () => {
    const text = document.getElementById('fText').value.trim();
    if (!text) return;
    addEntry(text);
    closePanel();
    render();
  };
  document.getElementById('addAnotherBtn').onclick = () => {
    const ta = document.getElementById('fText');
    const text = ta.value.trim();
    if (!text) return;
    addEntry(text);
    ta.value = '';
    ta.focus();
    const doneCountNow = entries.filter(e => e.done).length;
    document.querySelector('.count').textContent = `${entries.length} · ${doneCountNow} done`;
  };

  document.querySelectorAll('.checkbox').forEach(cb => { cb.onclick = () => toggleDone(Number(cb.dataset.id)); });
  document.querySelectorAll('[data-del]').forEach(btn => { btn.onclick = () => deleteEntry(Number(btn.dataset.del)); });
}

  app.className = 'wrap no-fab-pad';
  const modelOptions = MODELS.map(m => `<option value="${m.id}" ${m.id === settings.model ? 'selected' : ''}>${escapeHtml(m.label)}</option>`).join('');

        <button class="menu-btn" id="menuBtn">&#9776;</button>

      </div>

      <label>Google AI Studio API key</label>

        <button class="key-toggle" id="toggleKeyBtn">${keyVisible ? 'hide' : 'show'}</button>

      <button class="danger-btn" id="clearDocketBtn">Clear all docket entries</button>
    </div>
  `;

  document.getElementById('menuBtn').onclick = openDrawer;
  document.getElementById('toggleKeyBtn').onclick = toggleKeyVisibility;
  document.getElementById('saveSettingsBtn').onclick = saveSettingsForm;

function handleIncomingSay() {
  const params = new URLSearchParams(location.search);
  const say = params.get('say');
  if (!say) return;
  // Strip the query string immediately so a refresh/relaunch doesn't resend it.
  history.replaceState(null, '', location.pathname);
  view = 'chat';
  render();
  sendChatMessage(say);
}

(function init() {
  app.innerHTML = `<div class="status">loading…</div>`;
  loadAll();
  render();
  handleIncomingSay();
})();
</script>
